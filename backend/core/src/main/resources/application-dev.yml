spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/opendarts_db
    username: postgres
    password: postgres

autoscore:
  host: localhost
  port: 8765

logging:
  level:
    io.github.dmall.opendarts: INFO
    org.springframework.web: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%mdc] [%thread] %-5level %logger{36} - %msg%n"
